name: Transcribe LAOS real-source clips batch 02

on:
  push:
    branches: [automation/real-clips-20260807]
    paths: [.github/workflows/transcribe-real-clips-batch02.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          python -m pip install requests faster-whisper yt-dlp
      - name: Download official sources and transcribe
        run: |
          cat > batch02_transcribe.py <<'PY'
          from pathlib import Path
          import json, subprocess
          import requests
          from faster_whisper import WhisperModel

          ITEMS = [
            {
              "id":"REAL-004",
              "mode":"youtube",
              "source":"https://www.youtube.com/watch?v=6zasTmmR95E",
              "page":"https://www.jpl.nasa.gov/videos/crazy-engineering-gecko-gripper/"
            },
            {
              "id":"REAL-005",
              "mode":"direct",
              "source":"https://d2pn8kiwq2w21t.cloudfront.net/media/videosmars20150122mars20150122-1280.m4v",
              "page":"https://www.jpl.nasa.gov/videos/crazy-engineering-mars-helicopter/"
            },
            {
              "id":"REAL-006",
              "mode":"youtube",
              "source":"https://www.youtube.com/watch?v=7RrWZJHkREI",
              "page":"https://www.jpl.nasa.gov/videos/crazy-engineering-cubesats/"
            }
          ]
          sources=Path('sources-batch02'); transcripts=Path('transcripts-batch02')
          sources.mkdir(exist_ok=True); transcripts.mkdir(exist_ok=True)
          model=WhisperModel('base.en', device='cpu', compute_type='int8')
          results=[]
          for item in ITEMS:
            if item['mode']=='youtube':
              template=str(sources/f"{item['id']}.%(ext)s")
              subprocess.run(['yt-dlp','--no-playlist','-f','bv*[height<=720]+ba/b[height<=720]','--merge-output-format','mp4','-o',template,item['source']],check=True)
              matches=sorted(sources.glob(f"{item['id']}.*"))
              if not matches: raise RuntimeError('yt-dlp produced no file')
              source=matches[0]
            else:
              source=sources/f"{item['id']}.m4v"
              with requests.get(item['source'],stream=True,timeout=120,headers={'User-Agent':'Mozilla/5.0'}) as r:
                r.raise_for_status()
                with source.open('wb') as f:
                  for chunk in r.iter_content(1024*1024):
                    if chunk:f.write(chunk)
            probe=subprocess.run(['ffprobe','-v','error','-show_entries','format=duration','-of','default=nw=1:nk=1',str(source)],capture_output=True,text=True,check=True)
            segments,info=model.transcribe(str(source),language='en',beam_size=5,vad_filter=False,word_timestamps=True,condition_on_previous_text=True)
            rows=[]
            for s in segments:
              rows.append({'start':round(float(s.start),3),'end':round(float(s.end),3),'text':s.text.strip(),'words':[{'start':round(float(w.start or s.start),3),'end':round(float(w.end or s.end),3),'word':w.word} for w in (s.words or [])]})
            payload={'id':item['id'],'page':item['page'],'source':item['source'],'local_name':source.name,'duration':float(probe.stdout.strip()),'language':info.language,'segments':rows}
            (transcripts/f"{item['id']}_transcript.json").write_text(json.dumps(payload,ensure_ascii=False,indent=2),encoding='utf-8')
            results.append({'id':item['id'],'duration':payload['duration'],'segments':len(rows),'source':item['source']})
          (transcripts/'summary.json').write_text(json.dumps(results,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
          python batch02_transcribe.py
      - uses: actions/upload-artifact@v4
        with:
          name: LAOS-real-clips-batch02-transcripts
          path: transcripts-batch02/*.json
          retention-days: 7
