name: Transcribe LAOS real-source clips batch 02 direct

on:
  push:
    branches: [automation/real-clips-20260807]
    paths: [.github/workflows/transcribe-real-clips-batch02-direct.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          python -m pip install requests faster-whisper
      - name: Download official JPL sources and transcribe
        run: |
          cat > batch02_direct_transcribe.py <<'PY'
          from pathlib import Path
          import json, subprocess
          import requests
          from faster_whisper import WhisperModel

          ITEMS = [
            {
              "id":"REAL-004",
              "source":"https://d2pn8kiwq2w21t.cloudfront.net/media/videosmars20150122mars20150122-1280.m4v",
              "page":"https://www.jpl.nasa.gov/videos/crazy-engineering-mars-helicopter/"
            },
            {
              "id":"REAL-005",
              "source":"https://d2pn8kiwq2w21t.cloudfront.net/media/videostechnology2017041920170419-TECHf-0001-720cc.m4v",
              "page":"https://www.jpl.nasa.gov/videos/crazy-engineering-astrodynamics/"
            },
            {
              "id":"REAL-006",
              "source":"https://d2pn8kiwq2w21t.cloudfront.net/media/videoswfpc20150423JPL-20150422-mCrazEng-0000-Ep3_WFPC2-A-1280.m4v",
              "page":"https://www.jpl.nasa.gov/videos/crazy-engineering-the-camera-that-fixed-hubble/"
            }
          ]

          sources=Path('sources-batch02-direct')
          transcripts=Path('transcripts-batch02-direct')
          sources.mkdir(exist_ok=True)
          transcripts.mkdir(exist_ok=True)
          model=WhisperModel('base.en', device='cpu', compute_type='int8')
          summary=[]

          for item in ITEMS:
            source=sources/f"{item['id']}.m4v"
            with requests.get(item['source'],stream=True,timeout=180,headers={'User-Agent':'Mozilla/5.0 LAOS editorial research'}) as r:
              r.raise_for_status()
              with source.open('wb') as f:
                for chunk in r.iter_content(1024*1024):
                  if chunk:
                    f.write(chunk)
            if source.stat().st_size < 1_000_000:
              raise RuntimeError(f"source too small: {source}")
            probe=subprocess.run(['ffprobe','-v','error','-show_entries','format=duration','-of','default=nw=1:nk=1',str(source)],capture_output=True,text=True,check=True)
            segments,info=model.transcribe(str(source),language='en',beam_size=5,vad_filter=False,word_timestamps=True,condition_on_previous_text=True)
            rows=[]
            for s in segments:
              rows.append({
                'start':round(float(s.start),3),
                'end':round(float(s.end),3),
                'text':s.text.strip(),
                'words':[{'start':round(float(w.start or s.start),3),'end':round(float(w.end or s.end),3),'word':w.word} for w in (s.words or [])]
              })
            payload={
              'id':item['id'],
              'page':item['page'],
              'source':item['source'],
              'duration':float(probe.stdout.strip()),
              'language':info.language,
              'segments':rows
            }
            (transcripts/f"{item['id']}_transcript.json").write_text(json.dumps(payload,ensure_ascii=False,indent=2),encoding='utf-8')
            (transcripts/f"{item['id']}_plain.txt").write_text('\n'.join(f"[{r['start']:.2f}-{r['end']:.2f}] {r['text']}" for r in rows),encoding='utf-8')
            summary.append({'id':item['id'],'duration':payload['duration'],'segments':len(rows),'source':item['source']})

          (transcripts/'summary.json').write_text(json.dumps(summary,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
          python batch02_direct_transcribe.py
      - uses: actions/upload-artifact@v4
        with:
          name: LAOS-real-clips-batch02-direct-transcripts
          path: transcripts-batch02-direct/*
          retention-days: 7
