name: Re-render final LAOS real-source shorts batch 03

on:
  push:
    branches: [automation/real-clips-20260807]
    paths: [.github/workflows/rerender-real-clips-batch03-final.yml]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

env:
  PYTHONUNBUFFERED: "1"

jobs:
  rerender:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install media stack
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install --upgrade pip
          python -m pip install requests pillow rapidfuzz faster-whisper

      - name: Download approved batch 03 draft
        uses: actions/download-artifact@v4
        with:
          name: LAOS-real-clips-batch-03
          path: previous
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 31195322216

      - name: Create precision soundbite renderer
        run: |
          cat > rerender_batch03.py <<'PY'
          from __future__ import annotations

          import json
          import re
          import shutil
          import subprocess
          from pathlib import Path
          from typing import Any

          import requests
          from PIL import Image, ImageDraw, ImageFont, ImageOps
          from rapidfuzz import fuzz
          from faster_whisper import WhisperModel

          ROOT = Path(__file__).resolve().parent
          PREVIOUS = ROOT / "previous" / "output-batch03"
          OUT = ROOT / "output-batch03-final"
          SRC = ROOT / "sources-batch03-final"
          WORK = ROOT / "work-batch03-final"
          W, H = 1080, 1920
          BOLD = "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf"
          REG = "/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf"

          ITEMS: list[dict[str, Any]] = [
              {
                  "id": "REAL-007",
                  "account": "@angeln.py",
                  "series": "BUILD IN PUBLIC",
                  "title": "DE UNA SERVILLETA A MARTE",
                  "quote_en": "It's gone from designs on napkins, to Powerpoint, you know, to CAD drawings, to blueprints, and now it's a rover",
                  "quote_es": "Pasó de diseños en servilletas a CAD, planos… y ahora es un rover.",
                  "url": "https://d2pn8kiwq2w21t.cloudfront.net/media/videosmsl20100723bldgcuriosity20100723-1280.m4v",
                  "fallback": [9.5, 21.5],
              },
              {
                  "id": "REAL-008",
                  "account": "@laostechnologies",
                  "series": "SRE EN MARTE",
                  "title": "LOS INGENIEROS AMAN LO ABURRIDO",
                  "quote_en": "Engineers love boring. Boring means clear skies, no problems, work is a little easier, and scientists get data they want",
                  "quote_es": "Los ingenieros aman lo aburrido: cielo limpio, cero problemas y datos llegando.",
                  "url": "https://d2pn8kiwq2w21t.cloudfront.net/media/videosmer20140123bMER10Challenges20140123-1280.m4v",
                  "fallback": [6.5, 18.5],
              },
              {
                  "id": "REAL-009",
                  "account": "@laostechnologies",
                  "series": "CALIDAD EXTREMA",
                  "title": "LA CONTAMINACIÓN PUEDE INVENTAR VIDA",
                  "quote_en": "We don't want to have these samples come back from Mars and discover life in them but then realize that oh, that's life that was in the apparatus when we sent it to Mars",
                  "quote_es": "No querían descubrir vida… y descubrir después que la habían enviado desde la Tierra.",
                  "url": "https://d2pn8kiwq2w21t.cloudfront.net/media/Perseverances_Sample_Tubes_Ready_for_Mars_-_720.m4v",
                  "fallback": [57.0, 72.0],
              },
              {
                  "id": "REAL-010",
                  "account": "@angeln.py",
                  "series": "DEBUGGING REAL",
                  "title": "PRUEBA EN TIERRA. EJECUTA EN MARTE.",
                  "quote_en": "What we want to be able to do is to experiment with different extraction techniques down here on Earth before we actually do them for real up on Mars",
                  "quote_es": "Probaron distintas técnicas en la Tierra antes de ejecutarlas de verdad en Marte.",
                  "url": "https://d2pn8kiwq2w21t.cloudfront.net/media/videosmermer20090701mer20090701-1280.m4v",
                  "fallback": [10.0, 24.0],
              },
          ]

          def run(cmd: list[str], *, capture: bool = False, timeout: int = 1800) -> subprocess.CompletedProcess[str]:
              print("+", " ".join(cmd), flush=True)
              return subprocess.run(
                  cmd,
                  check=True,
                  text=True,
                  stdout=subprocess.PIPE if capture else None,
                  stderr=subprocess.PIPE if capture else None,
                  timeout=timeout,
              )

          def duration(path: Path) -> float:
              result = run(
                  ["ffprobe", "-v", "error", "-show_entries", "format=duration", "-of", "default=nw=1:nk=1", str(path)],
                  capture=True,
              )
              return float(result.stdout.strip())

          def download(url: str, destination: Path) -> None:
              destination.parent.mkdir(parents=True, exist_ok=True)
              if destination.exists() and destination.stat().st_size > 1_000_000:
                  return
              with requests.get(url, stream=True, timeout=180, headers={"User-Agent": "Mozilla/5.0 LAOS editorial renderer"}) as response:
                  response.raise_for_status()
                  with destination.open("wb") as handle:
                      for chunk in response.iter_content(1024 * 1024):
                          if chunk:
                              handle.write(chunk)
              if destination.stat().st_size < 1_000_000:
                  raise RuntimeError(f"Bad source: {destination}")

          def normalize(text: str) -> str:
              return re.sub(r"[^a-z0-9 ]+", " ", text.lower()).strip()

          def transcribe_words(model: WhisperModel, source: Path) -> list[dict[str, Any]]:
              segments, _ = model.transcribe(
                  str(source),
                  language="en",
                  beam_size=4,
                  vad_filter=False,
                  word_timestamps=True,
                  condition_on_previous_text=True,
              )
              words: list[dict[str, Any]] = []
              for segment in segments:
                  for word in segment.words or []:
                      token = normalize(word.word)
                      if token and word.start is not None and word.end is not None:
                          words.append({"token": token, "start": float(word.start), "end": float(word.end), "raw": word.word})
              return words

          def precise_window(words: list[dict[str, Any]], quote: str, fallback: list[float]) -> tuple[float, float, str, float, bool]:
              target_tokens = normalize(quote).split()
              target = " ".join(target_tokens)
              target_len = len(target_tokens)
              best: tuple[int, int, str, float] | None = None
              min_len = max(5, target_len - 5)
              max_len = target_len + 8
              for start_index in range(len(words)):
                  for length in range(min_len, max_len + 1):
                      end_index = start_index + length
                      if end_index > len(words):
                          break
                      candidate = " ".join(word["token"] for word in words[start_index:end_index])
                      raw_score = fuzz.ratio(target, candidate)
                      length_penalty = abs(length - target_len) * 0.8
                      score = raw_score - length_penalty
                      if best is None or score > best[3]:
                          best = (start_index, end_index, candidate, score)
              if best is None or best[3] < 68:
                  return float(fallback[0]), float(fallback[1]), best[2] if best else "", best[3] if best else 0.0, True
              start_index, end_index, candidate, score = best
              start = max(0.0, words[start_index]["start"] - 0.38)
              end = words[end_index - 1]["end"] + 0.48
              if end - start > 12.0:
                  center = (start + end) / 2
                  start = max(0.0, center - 6.0)
                  end = start + 12.0
              if end - start < 5.0:
                  end = start + 5.0
              return start, end, candidate, score, False

          def font(size: int, bold: bool = False) -> ImageFont.FreeTypeFont:
              return ImageFont.truetype(BOLD if bold else REG, size)

          def wrap(draw: ImageDraw.ImageDraw, text: str, selected_font: ImageFont.FreeTypeFont, max_width: int) -> list[str]:
              lines: list[str] = []
              current = ""
              for word in text.split():
                  trial = word if not current else f"{current} {word}"
                  if draw.textbbox((0, 0), trial, font=selected_font)[2] <= max_width:
                      current = trial
                  else:
                      if current:
                          lines.append(current)
                      current = word
              if current:
                  lines.append(current)
              return lines

          def centered(draw: ImageDraw.ImageDraw, text: str, selected_font: ImageFont.FreeTypeFont, y: int, max_width: int, fill: tuple[int, int, int, int], spacing: int = 12) -> int:
              for line in wrap(draw, text, selected_font, max_width):
                  box = draw.textbbox((0, 0), line, font=selected_font)
                  x = (W - (box[2] - box[0])) / 2
                  draw.text((x, y), line, font=selected_font, fill=fill, stroke_width=2, stroke_fill=(0, 0, 0, 180))
                  y += box[3] - box[1] + spacing
              return y

          def sound_overlay(item: dict[str, Any], output: Path) -> None:
              image = Image.new("RGBA", (W, H), (0, 0, 0, 0))
              draw = ImageDraw.Draw(image, "RGBA")
              draw.rounded_rectangle((36, 36, 600, 106), radius=34, fill=(3, 8, 17, 225), outline=(64, 169, 255, 170), width=2)
              draw.text((66, 59), f"{item['account']} · {item['series']}", font=font(24, True), fill=(250, 252, 255, 255))
              draw.rounded_rectangle((818, 40, 1040, 104), radius=31, fill=(37, 127, 245, 238))
              label = "CLIP REAL"
              box = draw.textbbox((0, 0), label, font=font(22, True))
              draw.text((929 - (box[2] - box[0]) / 2, 61), label, font=font(22, True), fill=(255, 255, 255, 255))
              draw.rounded_rectangle((48, 1060, 1032, 1818), radius=46, fill=(2, 7, 14, 216), outline=(255, 255, 255, 38), width=2)
              y = centered(draw, item["title"], font(61, True), 1120, 890, (255, 255, 255, 255), 8) + 28
              centered(draw, item["quote_es"], font(37, True), y, 850, (255, 220, 91, 255), 12)
              draw.text((44, H - 52), "Courtesy NASA/JPL-Caltech · análisis editorial LAOS · sin afiliación", font=font(18), fill=(236, 242, 250, 226))
              image.save(output)

          def render_sound(source: Path, start: float, seconds: float, overlay: Path, output: Path) -> None:
              video_filter = (
                  "[0:v]split=2[bg][fg];"
                  "[bg]scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,boxblur=34:1,eq=brightness=-0.23[bg2];"
                  "[fg]scale=1000:1020:force_original_aspect_ratio=decrease[fg2];"
                  "[bg2][fg2]overlay=(W-w)/2:150[scene];"
                  f"[scene][1:v]overlay=0:0,fade=t=in:st=0:d=0.14,fade=t=out:st={max(0.15, seconds - 0.14):.3f}:d=0.14,format=yuv420p,setsar=1[v]"
              )
              run(
                  [
                      "ffmpeg", "-y", "-ss", f"{start:.3f}", "-t", f"{seconds:.3f}", "-i", str(source),
                      "-loop", "1", "-i", str(overlay),
                      "-filter_complex", video_filter,
                      "-map", "[v]", "-map", "0:a?",
                      "-af", "loudnorm=I=-15:LRA=11:TP=-1.5,aresample=48000",
                      "-r", "30", "-c:v", "libx264", "-preset", "veryfast", "-crf", "19",
                      "-c:a", "aac", "-b:a", "160k", "-ar", "48000", "-ac", "2", "-shortest", str(output),
                  ]
              )

          def strip_old_sound(previous_video: Path, seconds: float, output: Path) -> None:
              run(
                  [
                      "ffmpeg", "-y", "-ss", f"{seconds:.3f}", "-i", str(previous_video),
                      "-c:v", "libx264", "-preset", "veryfast", "-crf", "19", "-pix_fmt", "yuv420p",
                      "-c:a", "aac", "-b:a", "160k", "-ar", "48000", "-ac", "2", str(output),
                  ]
              )

          def concat(parts: list[Path], output: Path) -> None:
              listing = output.with_suffix(".txt")
              listing.write_text("".join(f"file '{part.resolve().as_posix()}'\n" for part in parts), encoding="utf-8")
              run(
                  [
                      "ffmpeg", "-y", "-f", "concat", "-safe", "0", "-i", str(listing),
                      "-c:v", "libx264", "-preset", "veryfast", "-crf", "19", "-pix_fmt", "yuv420p",
                      "-c:a", "aac", "-b:a", "160k", "-ar", "48000", "-ac", "2", "-movflags", "+faststart", str(output),
                  ]
              )

          def build_preview(covers: list[Path]) -> None:
              canvas = Image.new("RGB", (1080, 1920), (8, 12, 20))
              for index, cover in enumerate(covers):
                  image = Image.open(cover).convert("RGB")
                  fitted = ImageOps.fit(image, (540, 960), method=Image.Resampling.LANCZOS)
                  x = (index % 2) * 540
                  y = (index // 2) * 960
                  canvas.paste(fitted, (x, y))
              canvas.save(OUT / "00_PREVIEW_LAOS_Real_Clips_Batch_03_Final.jpg", quality=93)

          def main() -> None:
              if not PREVIOUS.exists():
                  raise RuntimeError(f"Previous batch missing: {PREVIOUS}")
              if OUT.exists():
                  shutil.rmtree(OUT)
              shutil.copytree(PREVIOUS, OUT)
              SRC.mkdir(parents=True, exist_ok=True)
              WORK.mkdir(parents=True, exist_ok=True)
              manifest_path = OUT / "manifest-batch03.json"
              manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
              by_id = {row["id"]: row for row in manifest}
              model = WhisperModel("base.en", device="cpu", compute_type="int8")
              covers: list[Path] = []

              for item in ITEMS:
                  row = by_id[item["id"]]
                  source = SRC / f"{item['id']}.m4v"
                  download(item["url"], source)
                  words = transcribe_words(model, source)
                  start, end, matched, score, used_fallback = precise_window(words, item["quote_en"], item["fallback"])
                  end = min(duration(source) - 0.1, end)
                  workdir = WORK / item["id"]
                  workdir.mkdir(parents=True, exist_ok=True)
                  overlay = workdir / "sound.png"
                  sound_overlay(item, overlay)
                  sound = workdir / "sound.mp4"
                  render_sound(source, start, end - start, overlay, sound)

                  old_sound_seconds = float(row["source_end"]) - float(row["source_start"])
                  previous_video = OUT / row["output"]
                  tail = workdir / "tail.mp4"
                  strip_old_sound(previous_video, old_sound_seconds, tail)
                  replacement = workdir / "replacement.mp4"
                  concat([sound, tail], replacement)
                  shutil.move(replacement, previous_video)

                  cover = OUT / row["cover"]
                  run(["ffmpeg", "-y", "-ss", "1.0", "-i", str(previous_video), "-frames:v", "1", "-q:v", "2", str(cover)])
                  covers.append(cover)

                  row["source_start"] = round(start, 3)
                  row["source_end"] = round(end, 3)
                  row["quote_match_score"] = round(score, 1)
                  row["quote_match_text"] = matched
                  row["used_fallback"] = used_fallback
                  row["duration_seconds"] = round(duration(previous_video), 2)
                  row["precision_cut"] = "word_timestamps"

              manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2), encoding="utf-8")
              build_preview(covers)
              qc = OUT / "QC_Batch_03.md"
              qc.write_text(qc.read_text(encoding="utf-8") + "\n- Soundbites re-cortados con timestamps de palabra para evitar introducciones largas o frases truncadas.\n", encoding="utf-8")

          if __name__ == "__main__":
              main()
          PY

      - name: Re-render precision cuts
        run: python rerender_batch03.py

      - name: Validate final batch
        run: |
          set -euo pipefail
          test "$(find output-batch03-final -maxdepth 1 -name 'REAL-*.mp4' | wc -l)" -eq 4
          test "$(find output-batch03-final -maxdepth 1 -name 'REAL-*.jpg' | wc -l)" -eq 4
          test -f output-batch03-final/00_PREVIEW_LAOS_Real_Clips_Batch_03_Final.jpg
          for f in output-batch03-final/REAL-*.mp4; do
            width=$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 "$f")
            height=$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "$f")
            sar=$(ffprobe -v error -select_streams v:0 -show_entries stream=sample_aspect_ratio -of csv=p=0 "$f")
            audio=$(ffprobe -v error -select_streams a:0 -show_entries stream=codec_name -of csv=p=0 "$f")
            seconds=$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$f")
            echo "$f width=$width height=$height sar=$sar audio=$audio duration=$seconds"
            test "$width" = "1080"
            test "$height" = "1920"
            test "$sar" = "1:1"
            test -n "$audio"
            awk -v d="$seconds" 'BEGIN { exit !(d >= 20 && d <= 40) }'
          done
          cd output-batch03-final
          zip -9 -r ../LAOS_Real_Clips_Batch_03_Final_Complete.zip .

      - name: Upload final batch
        uses: actions/upload-artifact@v4
        with:
          name: LAOS-real-clips-batch-03-final
          path: |
            output-batch03-final/**
            LAOS_Real_Clips_Batch_03_Final_Complete.zip
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
