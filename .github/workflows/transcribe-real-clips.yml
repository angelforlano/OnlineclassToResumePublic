name: Transcribe LAOS real-source clips

on:
  push:
    branches: [automation/real-clips-20260807]
    paths: [.github/workflows/transcribe-real-clips.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  transcribe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          python -m pip install requests faster-whisper
      - name: Download and transcribe official sources
        run: |
          cat > transcribe.py <<'PY'
          import json, subprocess
          from pathlib import Path
          import requests
          from faster_whisper import WhisperModel

          SOURCES = {
              "REAL-001": "https://d2pn8kiwq2w21t.cloudfront.net/media/videostechnology20171121JPL-20171102-TECHp-0001-720cc.m4v",
              "REAL-002": "https://d2pn8kiwq2w21t.cloudfront.net/media/videostechnology20150603JPL-20150602-mTech-0000-CrazyEngineering_RoboSimian-A-1280.m4v",
              "REAL-003": "https://d2pn8kiwq2w21t.cloudfront.net/media/videosinsight20191003JPL-20191003-INSIGHf-0001-720cc.m4v",
          }
          out = Path("transcripts")
          src = Path("sources")
          out.mkdir(exist_ok=True)
          src.mkdir(exist_ok=True)
          model = WhisperModel("tiny.en", device="cpu", compute_type="int8")
          for clip_id, url in SOURCES.items():
              path = src / f"{clip_id}.m4v"
              with requests.get(url, stream=True, timeout=120, headers={"User-Agent":"Mozilla/5.0"}) as r:
                  r.raise_for_status()
                  with path.open("wb") as f:
                      for chunk in r.iter_content(1024 * 1024):
                          if chunk:
                              f.write(chunk)
              probe = subprocess.run(["ffprobe","-v","error","-show_entries","format=duration","-of","default=nw=1:nk=1",str(path)], capture_output=True, text=True, check=True)
              segments, info = model.transcribe(str(path), language="en", beam_size=3, vad_filter=True, word_timestamps=True)
              rows = []
              for s in segments:
                  rows.append({
                      "start": round(float(s.start), 3),
                      "end": round(float(s.end), 3),
                      "text": s.text.strip(),
                      "words": [{"start": round(float(w.start or s.start),3), "end": round(float(w.end or s.end),3), "word": w.word} for w in (s.words or [])],
                  })
              payload = {"id": clip_id, "source_url": url, "duration": float(probe.stdout.strip()), "language": info.language, "segments": rows}
              (out / f"{clip_id}_transcript.json").write_text(json.dumps(payload, ensure_ascii=False, indent=2), encoding="utf-8")
          PY
          python transcribe.py
      - name: Upload transcripts
        uses: actions/upload-artifact@v4
        with:
          name: LAOS-real-clips-transcripts
          path: transcripts/*.json
          retention-days: 7
