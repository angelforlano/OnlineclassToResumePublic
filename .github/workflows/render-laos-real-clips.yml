name: Render LAOS real interview clips batch 04 bundled

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/render-laos-real-clips.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout isolated renderer branch
        uses: actions/checkout@v4
        with:
          ref: automation/laos-real-clips-20260807

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install self-contained renderer dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests pillow rapidfuzz faster-whisper edge-tts imageio-ffmpeg
          python - <<'PY'
          import imageio_ffmpeg
          from pathlib import Path
          exe = Path(imageio_ffmpeg.get_ffmpeg_exe())
          print(exe)
          target = Path('/usr/local/bin/ffmpeg')
          target.unlink(missing_ok=True)
          target.symlink_to(exe)
          PY
          ffmpeg -version | head -1
          fc-match DejaVuSans.ttf

      - name: Patch duration probing to use PyAV
        run: |
          python - <<'PY'
          from pathlib import Path
          script = Path('social/real-clips/render.py')
          text = script.read_text(encoding='utf-8')
          start = text.index('def ffprobe_duration(path: Path) -> float:\n')
          end = text.index('\n\ndef transcribe(', start)
          replacement = '''def ffprobe_duration(path: Path) -> float:
              import av
              with av.open(str(path)) as container:
                  if container.duration is not None:
                      return float(container.duration / av.time_base)
                  stream = next((s for s in container.streams if s.type == "video"), None)
                  if stream is None or stream.duration is None:
                      raise RuntimeError(f"Could not determine duration for {path}")
                  return float(stream.duration * stream.time_base)
          '''
          script.write_text(text[:start] + replacement + text[end:], encoding='utf-8')
          PY

      - name: Render four real-source vertical clips
        working-directory: social/real-clips
        run: python render.py --manifest manifest_batch_04.json --model tiny.en

      - name: Verify outputs
        working-directory: social/real-clips
        run: |
          python - <<'PY'
          import av
          from pathlib import Path
          files = sorted(Path('output').glob('*.mp4'))
          assert len(files) == 4, files
          for path in files:
              with av.open(str(path)) as container:
                  video = next(s for s in container.streams if s.type == 'video')
                  audio = next(s for s in container.streams if s.type == 'audio')
                  assert video.codec_context.name == 'h264'
                  assert (video.width, video.height) == (1080, 1920)
                  assert audio.codec_context.name == 'aac'
                  print(path.name, video.width, video.height, video.codec_context.name, audio.codec_context.name)
          PY

      - name: Upload finished MP4s
        uses: actions/upload-artifact@v4
        with:
          name: LAOS-real-clips-batch-04
          path: |
            social/real-clips/output/*.mp4
            social/real-clips/output/*.jpg
            social/real-clips/output/*.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
